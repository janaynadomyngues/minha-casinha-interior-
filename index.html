  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Lato', sans-serif; }

    .home-header { text-align:center; padding:20px 24px 4px; position:relative; z-index:1; }
    .home-hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px 16px; text-align:center; position:relative; z-index:1; }

    .btn-main { border:none; border-radius:50px; padding:14px 32px; color:white; font-family:'Cormorant Garamond',serif; font-size:17px; letter-spacing:.5px; cursor:pointer; box-shadow:0 4px 20px rgba(155,77,114,0.25); transition:transform .15s; }
    .btn-main:active { transform:scale(.97); }
    .btn-back { background:transparent; border:1.5px solid rgba(155,77,114,0.3); border-radius:50px; padding:13px 18px; color:#9b4d72; font-size:13px; cursor:pointer; white-space:nowrap; }
    .btn-back-w { border-color:rgba(255,255,255,0.4); color:white; }
    .btn-ghost { background:rgba(255,255,255,0.2); border:1.5px solid rgba(255,255,255,0.45); border-radius:50px; padding:10px 18px; color:white; font-size:13px; cursor:pointer; }
    .icon-btn { background:transparent; border:none; font-size:22px; cursor:pointer; padding:8px; border-radius:50%; width:42px; height:42px; display:flex; align-items:center; justify-content:center; }
    .bottom-nav { display:flex; border-top:1px solid rgba(155,77,114,0.1); background:rgba(253,246,240,0.97); backdrop-filter:blur(12px); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom,0px); }
    .nav-btn { flex:1; background:transparent; border:none; padding:10px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:#b8957e; }
    .nav-btn span:first-child { font-size:20px; }

    .card { background:rgba(255,255,255,0.72); backdrop-filter:blur(12px); border-radius:22px; padding:20px 18px; border:1px solid rgba(155,77,114,0.15); margin-bottom:14px; }
    .lbl { font-size:10px; letter-spacing:3px; text-transform:uppercase; margin-bottom:12px; }
    .list-screen { overflow:hidden; }
    .list-hdr { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; flex-shrink:0; position:relative; z-index:1; }
    .list-title { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:400; color:#7a3f5a; }
    .list-body { flex:1; overflow-y:auto; padding:8px 16px 16px; position:relative; z-index:1; }
    .list-card { background:rgba(255,255,255,0.72); border-radius:18px; padding:16px; margin-bottom:12px; border:1px solid rgba(155,77,114,0.12); }
    .list-p { font-family:'Cormorant Garamond',serif; font-size:20px; color:#7a3f5a; }
    .list-d { font-size:11px; color:#b8957e; margin-top:2px; }
    .empty { text-align:center; padding:60px 24px; color:#9b7a6a; font-size:15px; line-height:1.7; }

    .cfg-desc { font-size:13px; color:#7a5a4a; line-height:1.65; margin-bottom:14px; }
    .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(50,30,40,0.9); color:white; padding:11px 22px; border-radius:50px; font-size:13px; white-space:nowrap; z-index:999; animation:toastIn .3s ease; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    @keyframes toastIn { from{opacity:0;transform:translate(-50%,10px)} to{opacity:1;transform:translate(-50%,0)} }
    .fade-up { animation:fadeIn .5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes p0{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(10deg)}}
    @keyframes p1{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px) rotate(-8deg)}}
    @keyframes p2{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
    @keyframes p3{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px) rotate(12deg)}}
    @keyframes p4{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    @keyframes p5{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) rotate(-6deg)}}

<script>
const MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DAYS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const PETALS=["🌸","🌺","✨","🌷","💫","🌼","💕"];
const PPOS=[[10,5],[30,88],[60,15],[80,75],[20,50],[70,92],[45,35]];
const PDUR=[8,10,7,9,11,6,9];

// ── DEVOCIONAIS PRÉ-ESCRITOS (abril–dezembro 2026) ──────────────────────────
// Indexados por semana do ano (getWeek)
const DEVOCIONAIS = {
  // ABRIL
  15: { palavra:"Florescer", tema:"Identidade em Deus", referencia:"Salmos 139:14", versiculo:"Eu te louvo porque me fizeste de modo especial e admirável. As tuas obras são maravilhosas, e eu sei muito bem disso.", frase_central:"Você não precisa se tornar alguém. Você já é quem Deus criou.", reflexao:"Florzinha, tem dias que você acorda se sentindo pequena demais. Como se todo mundo soubesse quem é, menos você. Mas a Palavra diz que você foi feita de modo especial — não produzida em série, não improvisada. Você foi admirável desde o início.", pergunta:"E se o problema não fosse quem você é... mas o que você acreditou sobre si mesma?", verdade:"Deus não erra. Quando Ele te criou, foi com intenção, com cuidado, com propósito. Você não é um acidente nem um rascunho. Você é obra Dele — e obras de Deus não são pequenas.", virada:"Parar de se comparar não é arrogância. É concordar com Deus. Ele disse que você é maravilhosa — e contradizer isso é contradizer o Criador.", aplicacao:["Fale em voz alta hoje: 'Eu sou obra de Deus'","Pare de pedir desculpa por existir do jeito que você é","Olhe no espelho e agradeça por um detalhe seu"], climax:"Você não é o que disseram de você. Você é o que Deus declarou sobre você.", oracao:"Pai, hoje eu escolho concordar com o que o Senhor diz sobre mim. Me ajuda a enxergar minha vida pelos Teus olhos. Amém." },
  16: { palavra:"Recomeço", tema:"Graça e recomeço", referencia:"Lamentações 3:22-23", versiculo:"As misericórdias do Senhor não têm fim! Suas bondades não têm limites. Renovam-se cada manhã; grande é a sua fidelidade.", frase_central:"Cada manhã é Deus dizendo: eu ainda acredito em você.", reflexao:"Florzinha, você não precisa carregar ontem para hoje. A misericórdia de Deus não é limitada pelo seu histórico. Ela se renova — todo dia, sem exceção, sem condição. Você acorda e já tem uma nova porção de graça esperando por você.", pergunta:"O que você está carregando de ontem que Deus já jogou no mar do esquecimento?", verdade:"Deus não guarda rancor. Ele não fica repassando seus erros enquanto você dorme. A cada manhã, o placar zera — não porque você merece, mas porque Ele escolhe. Isso se chama graça.", virada:"Recomeçar não é fingir que nada aconteceu. É aceitar que o que aconteceu não define o que vem. O seu próximo capítulo não depende do anterior.", aplicacao:["Escreva uma coisa que você quer deixar para trás hoje","Agradeça pela manhã como se fosse um presente","Não reviva o erro de ontem — ele já foi coberto"], climax:"Você não é seus erros. Você é a filha que Deus acorda toda manhã com graça nova.", oracao:"Senhor, obrigada por não me dar o que eu mereço, mas o que o Senhor quer me dar. Recebo essa manhã como recomeço. Amém." },
  17: { palavra:"Propósito", tema:"Propósito", referencia:"Jeremias 29:11", versiculo:"Porque eu sei os planos que tenho para vocês, diz o Senhor, planos de fazê-los prosperar e não de causar dano, planos de dar a vocês esperança e um futuro.", frase_central:"Você não está perdida. Você está sendo preparada.", reflexao:"Florzinha, tem uma diferença enorme entre estar perdida e estar em preparo. Quando você sente que não está avançando, talvez Deus esteja te fundando. As raízes crescem antes das flores aparecerem — e ninguém vê esse processo.", pergunta:"E se a fase que parece estagnada for exatamente onde Deus está te formando?", verdade:"O plano de Deus para você não depende da sua velocidade. Ele não está com pressa — mas também não está atrasado. Cada desvio que você viveu foi usado. Cada dor foi trabalhada. Nada foi desperdiçado.", virada:"Você não precisa entender o processo para confiar no Arquiteto. Deus não faz plantas sem saber o que vai construir.", aplicacao:["Pare de se comparar com o ritmo de outra mulher","Pergunte a Deus: o que o Senhor está construindo em mim agora?","Confie em um aspecto da sua vida que parece parado"], climax:"Você não está para trás. Você está exatamente onde o plano de Deus precisa que você esteja.", oracao:"Pai, eu confio no Teu plano mesmo quando não consigo enxergar. Me dá fé para o processo. Amém." },
  18: { palavra:"Força", tema:"Força na fraqueza", referencia:"Isaías 40:31", versiculo:"Mas os que esperam no Senhor renovam as suas forças. Voam alto como águias; correm e não ficam exaustos, caminham e não se cansam.", frase_central:"A sua fraqueza não é o fim. É onde a força de Deus começa.", reflexao:"Florzinha, você não precisa ter força suficiente. Você precisa saber onde buscar. Quando Deus fala em renovar forças, Ele não está falando de você se esforçar mais — está falando de você parar, esperar, e receber o que só Ele pode dar.", pergunta:"Você tem corrido no próprio fôlego ou tem esperado no Senhor?", verdade:"Deus não pede que você seja forte. Ele pede que você seja dependente d'Ele. A força que sustenta montanhas é a mesma disponível para você hoje — você só precisa pedir.", virada:"Admitir fraqueza não é derrota. É o primeiro passo para receber força sobrenatural. As águias não batem asas na tempestade — elas abrem e deixam o vento carregar.", aplicacao:["Identifique uma área onde você está tentando ser forte sozinha","Ore pedindo especificamente força para hoje","Descanse pelo menos 15 minutos sem culpa"], climax:"Você não precisa aguentar tudo. Você precisa confiar em Quem aguenta com você.", oracao:"Senhor, eu me rendo. Não tenho força suficiente, mas o Senhor tem. Carrega o que eu não consigo hoje. Amém." },
  // MAIO
  19: { palavra:"Cura", tema:"Cura interior", referencia:"Salmos 34:18", versiculo:"O Senhor está perto dos que têm o coração partido e salva os que estão com o espírito esmagado.", frase_central:"Deus não se afasta da sua dor. Ele entra nela com você.", reflexao:"Florzinha, você não precisa fingir que está bem para se aproximar de Deus. Ele não se impressiona com coragem fabricada. Ele se aproxima especialmente de quem está com o coração partido — porque é lá que Ele mais trabalha.", pergunta:"Você tem se aproximado de Deus com a sua dor real, ou tem guardado a dor e mostrado só o que parece bonito?", verdade:"Cura não significa esquecer. Significa que a memória já não tem poder sobre você. Deus não apaga o que aconteceu — Ele ressignifica. O que quebrou pode se tornar exatamente o que te torna forte.", virada:"A sua dor não te desqualifica. Ela te qualifica para ajudar outras mulheres que ainda estão onde você estava.", aplicacao:["Traga uma dor real para Deus hoje — sem filtro","Permita-se chorar se precisar. Lágrimas não são fraqueza","Procure uma pessoa de confiança para conversar"], climax:"Você não está quebrada demais para ser curada. Você está exatamente do jeito certo para o toque de Deus.", oracao:"Pai, aqui está minha dor. Não vou mais esconder. Cura o que ainda dói em mim. Amém." },
  20: { palavra:"Presença", tema:"Presença de Deus", referencia:"Salmos 16:11", versiculo:"Tu me mostrarás o caminho da vida; na tua presença há plenitude de alegria; na tua destra há deleites para sempre.", frase_central:"Tudo que você procura no mundo, você encontra na presença de Deus.", reflexao:"Florzinha, a presença de Deus não é um lugar que você visita na igreja. É uma realidade que você carrega. Ele está aqui agora, enquanto você lê isso, enquanto o dia começa. A pergunta não é onde Deus está — é se você está prestando atenção.", pergunta:"Quando foi a última vez que você parou tudo e simplesmente ficou na presença de Deus sem pedir nada?", verdade:"Na presença d'Ele há plenitude de alegria — não alegria parcial, não alegria condicional. Plenitude. O que o mundo oferece é fragmento. O que Deus oferece é inteiro.", virada:"Você não precisa de mais coisas. Você precisa de mais presença. É lá que a paz que excede o entendimento mora.", aplicacao:["Reserve 10 minutos hoje só para ficar em silêncio com Deus","Coloque uma música de adoração e simplesmente respire","Agradeça por três coisas específicas da Sua presença na sua vida"], climax:"Na presença de Deus você encontra tudo que andou procurando em outro lugar.", oracao:"Senhor, eu quero mais de Ti. Não das Tuas bênçãos — de Ti. Me ensina a viver na Tua presença. Amém." },
  21: { palavra:"Fé", tema:"Fé que avança", referencia:"Hebreus 11:1", versiculo:"A fé é a certeza daquilo que esperamos e a prova das coisas que não vemos.", frase_central:"Fé não é sentir que vai dar certo. É agir como se já tivesse dado.", reflexao:"Florzinha, fé não espera a evidência para acreditar — ela age antes da evidência aparecer. Não é ingenuidade. É certeza de quem conhece o Pai. Você pode não ver o caminho inteiro, mas Deus já está no fim dele acenando para você avançar.", pergunta:"Tem algo que Deus colocou no seu coração que você está esperando 'ter certeza' para começar?", verdade:"Deus não pede que você entenda tudo antes de confiar. Ele pede que você dê o próximo passo — só o próximo. Um passo de fé abre o caminho para o seguinte.", virada:"O que está travando você não é falta de condições. É falta de crença de que Deus honra quem confia n'Ele. Ele honra. Sempre honrou.", aplicacao:["Identifique um passo de fé que você tem adiado","Dê esse passo esta semana — mesmo com medo","Declare em voz alta: 'Eu confio no Senhor com isso'"], climax:"Você não precisa de mais certeza. Você precisa de mais fé em Quem é certo.", oracao:"Pai, me dá coragem para o próximo passo. Não preciso ver tudo — só confiar em Ti. Amém." },
  22: { palavra:"Amor", tema:"Amor próprio em Cristo", referencia:"1 João 4:19", versiculo:"Nós amamos porque ele nos amou primeiro.", frase_central:"Você só pode se amar de verdade quando entende o quanto Deus te ama.", reflexao:"Florzinha, amor próprio que não passa pelo amor de Deus é frágil. Ele dura enquanto as coisas estão indo bem. Mas quando você entende que Deus te amou no seu pior momento, no fundo do poço, antes de você fazer qualquer coisa certa — aí sim você tem uma base sólida para se amar.", pergunta:"Você tem se tratado com a mesma compaixão que daria a uma amiga que está passando pelo que você está passando?", verdade:"Você foi amada antes de ser perfeita. Antes de acertar. Antes de entender. Deus te amou no caos — e esse amor não depende do que você produz.", virada:"Cuidar de você não é egoísmo. É honrar o templo que Deus habita. Quando você se trata bem, você está tratando bem a morada do Espírito Santo.", aplicacao:["Faça algo gentil por você mesma hoje","Pare de usar linguagem cruel sobre si mesma","Leia Romanos 8:38-39 e receba o amor de Deus"], climax:"Você merece o amor que distribui para todo mundo. Inclusive de você mesma.", oracao:"Senhor, me ensina a me amar do jeito que o Senhor me ama. Sem condições, sem cobranças. Amém." },
  // JUNHO
  23: { palavra:"Paz", tema:"Paz que transcende", referencia:"Filipenses 4:7", versiculo:"E a paz de Deus, que excede todo o entendimento, guardará os seus corações e as suas mentes em Cristo Jesus.", frase_central:"A paz de Deus não faz sentido — e é exatamente por isso que é sobrenatural.", reflexao:"Florzinha, paz que depende de circunstância não é paz — é alívio temporário. A paz que Deus oferece é diferente. Ela está presente no meio da tempestade, no meio da incerteza, no meio do que você ainda não entende. Ela guarda seu coração quando tudo ao redor tenta roubar.", pergunta:"O que está roubando a sua paz hoje? E você entregou isso a Deus ou está tentando resolver sozinha?", verdade:"Deus não promete ausência de problemas. Ele promete presença no problema. E Sua presença traz uma paz que sua mente não consegue fabricar — só receber.", virada:"Parar de lutar contra o que você não controla não é desistir. É confiar. É deixar Deus ser Deus enquanto você respira.", aplicacao:["Escreva o que está te tirando a paz e entregue a Deus em oração","Escolha não checar aquela coisa que te gera ansiedade por uma hora","Respire fundo três vezes e declare: 'Eu tenho a paz de Deus'"], climax:"Você não precisa entender para ter paz. Você precisa confiar em Quem entende tudo.", oracao:"Pai, eu entrego o que não consigo controlar. Guarda meu coração com a Tua paz. Amém." },
  24: { palavra:"Esperança", tema:"Sonhos e espera", referencia:"Romanos 5:5", versiculo:"E a esperança não nos decepciona, porque Deus derramou seu amor em nossos corações por meio do Espírito Santo.", frase_central:"Esperar em Deus não é passividade. É confiança ativa.", reflexao:"Florzinha, você pode estar numa fase de espera — e isso é difícil. Especialmente quando você vê outras mulheres avançando e sente que ficou para trás. Mas a espera de Deus não é vazia. Ela está cheia de preparo, de formação, de raízes sendo fundadas.", pergunta:"Você tem esperado com fé ou tem esperado com ressentimento?", verdade:"O que Deus prometeu, Ele cumpre. No tempo d'Ele, da forma d'Ele. E o tempo d'Ele sempre é melhor do que o nosso. O que está demorado não está esquecido.", virada:"Esperança não é ilusão. É certeza fundamentada em quem Deus é — e Ele nunca falhou. Você pode plantar semente de esperança hoje mesmo sem ver o resultado.", aplicacao:["Relembre uma promessa que Deus já cumpriu na sua vida","Escreva o que você está esperando e ore sobre isso","Agradeça pelo que ainda não veio, como se já tivesse chegado"], climax:"O que Deus prometeu para você não tem prazo de validade. Ele é fiel.", oracao:"Senhor, eu escolho esperar com fé. O Senhor nunca me deixou sem resposta. Amém." },
  25: { palavra:"Coragem", tema:"Coragem", referencia:"Josué 1:9", versiculo:"Não fui eu que ordenei a você? Seja forte e corajoso! Não se apavore nem desanime, pois o Senhor, o seu Deus, estará com você por onde você andar.", frase_central:"Coragem não é ausência de medo. É decidir avançar mesmo com ele.", reflexao:"Florzinha, Deus não disse 'seja corajosa quando não tiver medo'. Ele disse 'seja corajosa' — sabendo que o medo existe. A coragem não é a ausência da emoção, é a decisão apesar dela. E o fundamento dessa decisão é saber que você não está sozinha.", pergunta:"O que você deixou de fazer porque o medo falou mais alto do que a fé?", verdade:"A presença de Deus não elimina o desafio. Ela torna o desafio possível. Você não precisa de condições perfeitas para avançar — você precisa de um Deus perfeito.", virada:"O medo mente. Ele faz o obstáculo parecer maior do que é e o seu Deus parecer menor do que Ele é. Inverte essa equação.", aplicacao:["Nomeie o medo que mais te paralisa hoje","Ore especificamente sobre esse medo","Dê um pequeno passo na direção do que teme"], climax:"Você tem tudo que precisa para avançar — porque você tem a Deus.", oracao:"Pai, onde o medo falar mais alto, que a Tua voz fale mais. Me dá coragem para o próximo passo. Amém." },
  26: { palavra:"Renovação", tema:"Renovação da mente", referencia:"Romanos 12:2", versiculo:"Não se amolde ao padrão deste mundo, mas transforme-se pela renovação da sua mente, para que seja capaz de experimentar e comprovar a boa, agradável e perfeita vontade de Deus.", frase_central:"O que você pensa sobre você molda quem você se torna.", reflexao:"Florzinha, a batalha mais importante da sua vida não acontece nas circunstâncias — acontece na sua mente. Os pensamentos que você alimenta se tornam crenças. As crenças se tornam decisões. As decisões moldam seu destino. Por isso Deus fala em renovar a mente — é o ponto de partida de tudo.", pergunta:"Qual pensamento sobre você mesma você precisa urgentemente substituir pela verdade de Deus?", verdade:"Você não é obrigada a acreditar em tudo que pensa. Pensamentos mentem. A Palavra de Deus é que é verdade — e ela diz que você é amada, escolhida, capaz, chamada.", virada:"Renovar a mente não é pensamento positivo. É substituir a mentira pela verdade de Deus, repetidamente, até que a verdade seja mais familiar que a mentira.", aplicacao:["Identifique um pensamento negativo recorrente sobre você","Encontre um versículo que contradiz esse pensamento","Repita esse versículo toda vez que o pensamento aparecer"], climax:"Você pode mudar o que você pensa. E quando muda o que pensa, muda o que vive.", oracao:"Senhor, renova minha mente. Substitui cada mentira que acreditei pela verdade do Teu amor. Amém." },
  // JULHO
  27: { palavra:"Graça", tema:"Graça e recomeço", referencia:"2 Coríntios 12:9", versiculo:"Mas ele me disse: 'A minha graça é suficiente para você, pois o meu poder se aperfeiçoa na fraqueza.'", frase_central:"Onde você é fraca, a graça de Deus é mais que suficiente.", reflexao:"Florzinha, a graça não é só perdão — é poder. É a capacidade sobrenatural de fazer o que você não consegue no próprio fôlego. Quando Deus diz que a Sua graça é suficiente, Ele não está minimizando sua situação. Ele está dizendo que é maior que ela.", pergunta:"Você tem pedido graça para as áreas onde se sente insuficiente, ou tem tentado resolver tudo na força própria?", verdade:"A graça de Deus não tem limite de uso. Você não pode esgotar. Você não pode pedir demais. Quanto mais fraca você se reconhece, mais espaço Ele tem para agir.", virada:"Sua insuficiência não é um problema para Deus resolver. É uma oportunidade para Ele mostrar que é suficiente por você.", aplicacao:["Identifique onde você mais precisa de graça agora","Ore pedindo graça específica para essa área","Pare de se punir por não conseguir sozinha"], climax:"Você não precisa ser suficiente. Você precisa de um Deus que é.", oracao:"Pai, onde eu sou fraca, que o Teu poder se manifeste. Recebo a Tua graça hoje. Amém." },
  28: { palavra:"Obediência", tema:"Obediência", referencia:"João 14:21", versiculo:"Quem tem os meus mandamentos e os guarda, esse é o que me ama; e quem me ama será amado por meu Pai, e eu o amarei e me manifestarei a ele.", frase_central:"Obedecer a Deus não é perder liberdade. É encontrar o caminho para a vida plena.", reflexao:"Florzinha, obediência parece uma palavra pesada. Mas quando você entende que os caminhos de Deus existem para te proteger e não para te limitar, ela se torna libertadora. Deus não dá instruções para te controlar — Ele dá porque conhece todos os caminhos e sabe quais levam à vida.", pergunta:"Tem algo que Deus tem te pedido que você ainda não obedeceu por medo ou por não entender?", verdade:"Você não precisa entender o 'porquê' para obedecer. Você precisa confiar em Quem pede. E Deus sempre pede o que é bom para você.", virada:"Quando você obedece a Deus, você não está perdendo nada. Você está se posicionando para receber tudo que Ele preparou.", aplicacao:["Pergunte a Deus: tem algo que o Senhor me pediu que eu ainda não fiz?","Dê um passo de obediência nessa área hoje","Confie que Deus honra quem O honra"], climax:"Sua obediência não é para Deus — é para você. É o caminho para a vida que você quer viver.", oracao:"Senhor, me mostra onde preciso obedecer. Me dá vontade e coragem para isso. Amém." },
  29: { palavra:"Descanso", tema:"Presença de Deus", referencia:"Mateus 11:28", versiculo:"Venham a mim, todos os que estão cansados e sobrecarregados, e eu darei descanso a vocês.", frase_central:"Descansar em Deus não é sinal de fraqueza. É sinal de sabedoria.", reflexao:"Florzinha, você foi criada para produzir — mas não para isso somente. Você tem valor fora da sua produtividade. Quando Deus criou o descanso no sétimo dia, não foi porque Ele estava cansado. Foi para te mostrar que parar faz parte do plano.", pergunta:"Você tem dado ao seu corpo, mente e espírito o descanso que precisam, ou tem vivido no limite do esgotamento?", verdade:"O descanso que Deus oferece vai além de dormir. É uma paz de alma que vem de confiar que Ele está cuidando do que você não pode controlar enquanto você para.", virada:"Você não precisa resolver tudo hoje. Não precisa responder tudo hoje. Pode parar — e o mundo vai continuar, porque Deus está no controle.", aplicacao:["Tire 20 minutos hoje para não fazer nada produtivo","Durma no horário que seu corpo pede","Diga não para uma coisa que está te esgotando"], climax:"Você não precisa merecer descanso. Você precisa receber o convite que Jesus já fez.", oracao:"Jesus, eu venho a Ti cansada. Recebe o meu peso e me dá o Teu descanso. Amém." },
  30: { palavra:"Alegria", tema:"Florescer", referencia:"Neemias 8:10", versiculo:"A alegria do Senhor é a sua força.", frase_central:"Alegria não é a ausência de problemas. É a presença de Deus no meio deles.", reflexao:"Florzinha, alegria e felicidade são coisas diferentes. Felicidade depende do que acontece. Alegria vem de quem está com você. E quando Deus está com você, há uma fonte de alegria que as circunstâncias não alcançam.", pergunta:"Você tem buscado felicidade nas circunstâncias ou alegria na presença de Deus?", verdade:"A alegria do Senhor é sua força — não sua emoção do momento. Quando você está alegre em Deus, você tem força para enfrentar o que vier. Alegria é estratégica.", virada:"Escolher alegria não é negar a dor. É declarar que a dor não tem a última palavra. Que Deus tem.", aplicacao:["Faça uma lista de três coisas que te trazem alegria genuína","Ria hoje — sem motivo extraordinário","Compartilhe alegria com alguém ao seu redor"], climax:"Você foi criada para florescer com alegria. Isso não é luxo — é o plano de Deus para você.", oracao:"Pai, restaura a alegria em mim. Não a que depende das circunstâncias, mas a que vem de Ti. Amém." },
  // AGOSTO
  31: { palavra:"Identidade", tema:"Identidade em Deus", referencia:"Efésios 1:4", versiculo:"Pois em Cristo nos escolheu antes da criação do mundo para sermos santos e irrepreensíveis aos seus olhos.", frase_central:"Você foi escolhida antes de existir. Isso muda tudo.", reflexao:"Florzinha, antes do mundo existir, Deus já te conhecia e já te tinha escolhido. Você não é uma surpresa para Ele. Não é um plano B. Não é alguém que Ele aceitou porque não tinha outra opção. Você foi escolhida, amada e chamada antes de qualquer coisa.", pergunta:"Você tem vivido como alguém escolhida por Deus ou como alguém tentando provar que merece ser escolhida?", verdade:"Sua identidade não vem do que você faz, do que já fez ou do que ainda vai fazer. Vem de quem te criou e te escolheu. E essa é uma identidade que ninguém pode tirar.", virada:"Quando você sabe quem você é em Deus, para de buscar aprovação onde ela não existe. O que o Criador diz sobre você é mais real do que qualquer opinião humana.", aplicacao:["Leia Efésios 1 inteiro hoje","Escreva três verdades que Deus diz sobre você","Pare de se definir pelo que outros pensam"], climax:"Você foi escolhida. Amada. Chamada. Isso é sua identidade — e nada muda isso.", oracao:"Pai, me ajuda a viver da identidade que o Senhor me deu, não da que o mundo tenta me impor. Amém." },
  32: { palavra:"Confiança", tema:"Fé que avança", referencia:"Provérbios 3:5-6", versiculo:"Confie no Senhor de todo o seu coração e não se apoie em seu próprio entendimento; reconheça o Senhor em todos os seus caminhos, e ele endireitará as suas veredas.", frase_central:"Confiar em Deus não é entender. É soltar o controle.", reflexao:"Florzinha, confiar é difícil quando você está acostumada a resolver tudo sozinha. Mas Deus pede uma confiança que vai além do entendimento — porque Ele sabe que o que Ele planeja é maior do que o que você consegue compreender agora.", pergunta:"Tem uma área da sua vida onde você diz que confia em Deus, mas na prática está tentando controlar tudo?", verdade:"Deus não pede que você entenda o caminho inteiro. Ele pede que você O reconheça a cada passo. E quando você faz isso, Ele endireita o que parece torto.", virada:"Largar o controle não é irresponsabilidade. É maturidade espiritual. É saber quem é o Deus que você serve.", aplicacao:["Identifique o que você mais tenta controlar","Entregue isso a Deus em oração específica","Toda vez que a ansiedade vier, declare: 'Eu confio em Ti'"], climax:"Você não precisa entender para confiar. Você precisa conhecer Aquele em quem confia.", oracao:"Senhor, eu soltou o que tenho segurado com força. Confio em Ti. Amém." },
  33: { palavra:"Vitória", tema:"Fé que avança", referencia:"1 Coríntios 15:57", versiculo:"Mas graças a Deus, que nos dá a vitória por meio de nosso Senhor Jesus Cristo!", frase_central:"Você já está do lado vencedor. Agora é viver como quem sabe disso.", reflexao:"Florzinha, a vitória já foi conquistada. Não é algo que você precisa ganhar — é algo que você precisa receber e viver. Jesus já venceu o que te opprime, o que te paralisa, o que te faz sentir que não adianta tentar.", pergunta:"Você tem vivido como vencedora ou como alguém ainda tentando provar que merece vencer?", verdade:"A vitória não é o resultado do seu esforço. É o resultado do que Jesus fez. O seu papel é crer e caminhar nessa realidade.", virada:"Você não luta para vencer. Você luta a partir da vitória. Essa inversão muda tudo sobre como você enfrenta os desafios.", aplicacao:["Declare hoje: 'Sou mais que vencedora em Cristo'","Identifique uma área onde você precisa caminhar na vitória","Agradeça a Deus pela vitória mesmo antes de ver o resultado"], climax:"A vitória já é sua. Agora é hora de andar como quem sabe disso.", oracao:"Pai, obrigada pela vitória que veio através de Jesus. Me ajuda a viver nessa realidade hoje. Amém." },
  34: { palavra:"Propósito", tema:"Propósito", referencia:"Efésios 2:10", versiculo:"Pois somos criação de Deus, criados em Cristo Jesus para fazer boas obras, as quais Deus preparou de antemão para que as praticássemos.", frase_central:"Você não precisa criar seu propósito. Ele já foi colocado dentro de você.", reflexao:"Florzinha, você não está aqui por acidente. Cada dom que você tem, cada experiência que você viveu, cada dor que você atravessou — tudo foi usado por Deus para formar exatamente a pessoa que Ele precisava que você fosse para o que Ele preparou.", pergunta:"Você tem usado os dons que Deus te deu ou tem ficado esperando condições perfeitas para começar?", verdade:"As boas obras que Deus preparou para você já existem — elas só estão esperando você aparecer. Não uma versão futura mais perfeita de você. Você, agora.", virada:"Seu propósito não começa quando você chegar a algum lugar. Começa onde você está, com o que você tem, sendo quem você é.", aplicacao:["Liste três coisas que você faz bem e que abençoam outros","Use um desses dons esta semana de forma intencional","Pergunte a Deus: como posso servir com o que o Senhor me deu?"], climax:"Você não foi criada para ser plateia. Foi criada para ser protagonista do plano de Deus.", oracao:"Pai, me mostra claramente o que o Senhor preparou para mim. Quero caminhar no meu propósito. Amém." },
  // SETEMBRO
  35: { palavra:"Liberdade", tema:"Cura interior", referencia:"João 8:36", versiculo:"Se, portanto, o Filho os libertar, vocês serão livres de verdade.", frase_central:"Você não precisa continuar presa ao que Jesus já libertou.", reflexao:"Florzinha, liberdade não é só ausência de correntes visíveis. É também soltar os padrões internos que te prendem — a necessidade de aprovação, o medo de falhar, a crença de que você nunca é suficiente. Jesus morreu para te libertar de tudo isso.", pergunta:"O que ainda te prende que você já sabe que Jesus veio libertar?", verdade:"A liberdade que Jesus oferece é real e completa. Não é uma liberdade parcial onde você é livre em algumas áreas e presa em outras. Ele veio para te libertar de verdade.", virada:"Manter-se presa depois da libertação é como ficar na cadeia depois que a porta foi aberta. A porta está aberta. Você pode sair.", aplicacao:["Identifique uma prisão interna que você ainda carrega","Ore pedindo libertação específica","Declare: 'Sou livre porque Jesus me libertou'"], climax:"A porta está aberta. Você já é livre. Agora é hora de andar como quem é.", oracao:"Jesus, obrigada pela liberdade que compraste para mim. Me ajuda a viver nela todos os dias. Amém." },
  36: { palavra:"Cuidado", tema:"Amor próprio em Cristo", referencia:"1 Pedro 5:7", versiculo:"Lancem sobre ele toda a sua ansiedade, porque ele tem cuidado de vocês.", frase_central:"Você tem Alguém que cuida de você. Pode parar de cuidar de tudo sozinha.", reflexao:"Florzinha, você cuida de tantas pessoas — sua família, seus amigos, seu trabalho. Mas quem cuida de você? A resposta é: Deus. E Ele faz isso com mais atenção, mais cuidado e mais amor do que qualquer pessoa pode oferecer.", pergunta:"Você tem lançado suas ansiedades sobre Deus ou tem carregado tudo sozinha por não querer incomodar nem Ele?", verdade:"Deus não fica sobrecarregado com suas preocupações. Ele convida você a lançar tudo sobre Ele. Cada detalhe, cada preocupação pequena, cada medo que você nem conta para ninguém.", virada:"Deixar Deus cuidar de você não é fraqueza. É intimidade. É confiar que Ele é o Pai que você sempre precisou.", aplicacao:["Faça uma lista das suas ansiedades e ore sobre cada uma","Aceite um cuidado que alguém queira te oferecer hoje","Descanse sabendo que Deus está de olho em você"], climax:"Você tem um Pai que cuida de você. Pode respirar.", oracao:"Pai, lanço sobre Ti tudo que estou carregando. Obrigada por cuidar de mim. Amém." },
  37: { palavra:"Renovação", tema:"Renovação da mente", referencia:"Isaías 43:19", versiculo:"Veja, estou fazendo uma coisa nova! Ela está brotando; vocês não a percebem? Estou abrindo um caminho no deserto e rios na terra árida.", frase_central:"Deus está fazendo algo novo. Você está percebendo?", reflexao:"Florzinha, às vezes estamos tão focadas no que foi, no que deu errado, no que não veio — que não percebemos o que Deus está construindo agora. A coisa nova não aparece onde você está olhando. Aparece onde você menos espera.", pergunta:"Você está tão presa ao passado que está perdendo o que Deus está fazendo no presente?", verdade:"Deus não está preso ao que aconteceu. Ele está agindo agora, abrindo caminhos onde você só vê deserto. O que parece seco pode ser exatamente onde Ele está colocando um rio.", virada:"Parar de olhar para trás não é negar a história. É ter fé suficiente para acreditar que o melhor ainda está por vir.", aplicacao:["Peça a Deus olhos para ver o que Ele está fazendo agora","Identifique um sinal de coisa nova na sua vida","Solte uma expectativa do passado que está te impedindo de ver o presente"], climax:"A coisa nova já está brotando. Abre os olhos, florzinha. Você está no meio de um milagre.", oracao:"Senhor, me dá olhos para ver o que o Senhor está fazendo. Não quero perder a coisa nova por estar olhando para o que foi. Amém." },
  38: { palavra:"Perseverança", tema:"Fé que avança", referencia:"Tiago 1:3-4", versiculo:"porque você sabe que a provação da sua fé produz perseverança. E a perseverança deve completar a sua obra, para que vocês sejam maduros e íntegros, sem que falte nada.", frase_central:"O que está te testando está te formando.", reflexao:"Florzinha, perseverança não se aprende na facilidade. Ela se forma exatamente na pressão, na espera, na situação que parece não ter saída. Deus não permite o teste para te destruir — Ele permite porque sabe o que vai crescer em você do outro lado.", pergunta:"O que você está prestes a desistir que Deus está usando para te formar?", verdade:"Você está mais forte do que pensa. Cada vez que você ficou e não foi embora, cada vez que você orou em vez de desistir, estava sendo formada.", virada:"Não abandone o processo antes do resultado. A perseverança não é só resistir — é crescer enquanto resiste.", aplicacao:["Identifique uma área onde você precisa perseverar","Ore pedindo força específica para essa área","Lembre de uma situação que você sobreviveu e agradeça"], climax:"Você não chegou até aqui para parar agora. Continue, florzinha.", oracao:"Pai, me dá força para continuar. Eu sei que o que o Senhor começou, o Senhor termina. Amém." },
  // OUTUBRO
  39: { palavra:"Abundância", tema:"Propósito", referencia:"João 10:10", versiculo:"O ladrão vem apenas para roubar, matar e destruir; eu vim para que tenham vida e a tenham em abundância.", frase_central:"Vida abundante não é perfeita. É plena.", reflexao:"Florzinha, Jesus não veio para te dar uma vida sem problemas. Veio para te dar uma vida com significado, com profundidade, com presença. Abundância não é ausência de dificuldade — é a presença de Deus que torna tudo suportável e cheio de sentido.", pergunta:"Você tem vivido a vida abundante que Jesus promete ou tem se contentado com muito menos?", verdade:"O ladrão vem para te convencer de que você não merece mais. Jesus veio para te mostrar que Ele veio exatamente para te dar o mais. Não se contente com o mínimo.", virada:"Abundância começa por dentro. Quando você tem paz, alegria e propósito, você tem abundância — independente das circunstâncias externas.", aplicacao:["Liste as formas de abundância que já existem na sua vida","Recuse um pensamento de escassez hoje","Agradeça por uma bênção que você tem naturalizado"], climax:"Você foi criada para a vida abundante. Não se contente com menos.", oracao:"Jesus, obrigada por vir para me dar vida em abundância. Me ajuda a viver e reconhecer essa abundância todos os dias. Amém." },
  40: { palavra:"Gratidão", tema:"Presença de Deus", referencia:"1 Tessalonicenses 5:18", versiculo:"Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para vocês.", frase_central:"Gratidão não espera as circunstâncias melhorarem. Ela transforma as circunstâncias.", reflexao:"Florzinha, gratidão é um ato de fé. Quando você agradece no meio da tempestade, está declarando que Deus é bom mesmo quando as coisas não parecem. Está exercitando a confiança que fortalece a fé.", pergunta:"Você consegue agradecer hoje mesmo pelas coisas que ainda não vieram do jeito que você queria?", verdade:"A gratidão muda a perspectiva. O que parece pouco começa a parecer muito. O que parecia faltar começa a ser visto como o suficiente que Deus está providenciando.", virada:"Uma vida de gratidão não é uma vida sem problemas. É uma vida onde você enxerga a mão de Deus mesmo nos problemas.", aplicacao:["Escreva 10 coisas pelas quais você é grata hoje","Agradeça por uma coisa difícil que te formou","Diga obrigada para alguém que faz diferença na sua vida"], climax:"Quanto mais você agradece, mais você tem para agradecer. Gratidão abre os olhos para as bênçãos invisíveis.", oracao:"Pai, obrigada. Por tudo. Pelo que veio e pelo que ainda vem. Pelo que entendi e pelo que ainda vou entender. Amém." },
  41: { palavra:"Restauração", tema:"Graça e recomeço", referencia:"Joel 2:25", versiculo:"Eu restaurarei os anos que os gafanhotos comeram.", frase_central:"Deus não só cura. Ele restaura o que foi perdido.", reflexao:"Florzinha, Deus não é só o Deus que cura as feridas. Ele é o Deus que restaura os anos. O que foi perdido — tempo, relacionamentos, oportunidades, sonhos — Deus tem o poder de restaurar de formas que você não consegue imaginar.", pergunta:"O que você acha que perdeu para sempre que pode estar nas mãos de Deus para ser restaurado?", verdade:"Deus não trabalha com o que poderia ter sido. Ele trabalha com o que é e transforma em algo melhor do que você esperava. A restauração d'Ele sempre supera a versão original.", virada:"Não é tarde demais. Não é muito para Deus restaurar. O que parece ruína nas suas mãos é material de construção nas mãos d'Ele.", aplicacao:["Entregue a Deus algo que você considera perdido","Ore pedindo restauração em uma área específica","Confie que o melhor ainda está por vir"], climax:"Deus restaura. Não parcialmente. Completamente. E melhor do que era antes.", oracao:"Senhor, Tu és o Deus que restaura. Entrego em Tuas mãos o que parecia perdido. Amém." },
  42: { palavra:"Chamado", tema:"Propósito", referencia:"Romanos 8:28", versiculo:"Sabemos que todas as coisas cooperam para o bem daqueles que amam a Deus, daqueles que são chamados segundo o seu propósito.", frase_central:"Você foi chamada. E tudo na sua vida está cooperando para isso.", reflexao:"Florzinha, até as coisas ruins estão sendo usadas por Deus para o seu bem. Não que Deus cause o mal — mas que Ele é tão soberano que pega o que o inimigo usou para te destruir e usa para te fortalecer. Isso é um Deus poderoso.", pergunta:"Tem uma situação difícil na sua vida que você ainda não consegue ver como Deus pode usar para o bem?", verdade:"Você foi chamada segundo um propósito. Isso significa que nada no seu caminho foi acidente. As dores, os desvios, as esperas — fazem parte da formação de quem você precisa ser.", virada:"Quando você entende que foi chamada, para de ver sua vida como uma série de eventos aleatórios e começa a ver como uma história escrita por Deus.", aplicacao:["Releia sua história com os olhos de Deus","Pergunte: como Deus pode usar isso para o meu bem?","Confie que o chamado de Deus sobre sua vida é irrevogável"], climax:"Você foi chamada. E o Que chamou é fiel para cumprir.", oracao:"Pai, eu confio que tudo coopera para o meu bem. Usa cada parte da minha história para o Teu propósito. Amém." },

function getWeek(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - start) / 864e5 + start.getDay() + 1) / 7);
}

function getDevo(date) {
  const week = getWeek(date);
  // Pega o devocional da semana ou o mais próximo disponível
  if (DEVOCIONAIS[week]) return DEVOCIONAIS[week];
  // Fallback: pega o mais próximo
  const keys = Object.keys(DEVOCIONAIS).map(Number).sort((a,b)=>a-b);
  const closest = keys.reduce((prev, curr) => Math.abs(curr-week) < Math.abs(prev-week) ? curr : prev);
  return DEVOCIONAIS[closest];
}

  else if(p===1){b1=`<div class="card" style="background:rgba(155,77,114,0.07);border-color:rgba(155,77,114,0.2);text-align:center;margin-bottom:14px"><div class="lbl" style="color:#9b4d72">✨ A verdade de hoje</div><p style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;font-style:italic;line-height:1.55;color:#7a3f5a">${devo.frase_central}</p></div>`;b2=`<div class="card"><div class="lbl" style="color:#c4836a">🌷 Reflexão</div><p style="font-size:14px;line-height:1.85;color:#4a3030">${devo.reflexao}</p></div>`;}
  else if(p===2){b1=`<div class="card" style="background:rgba(232,168,124,0.1);border-color:rgba(196,131,106,0.25);text-align:center;margin-bottom:14px"><div class="lbl" style="color:#c4836a">🔥 Uma pergunta para você</div><p style="font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.55;color:#7a5a20">${devo.pergunta}</p></div>`;b2=`<div class="card"><div class="lbl" style="color:#9b4d72">📖 O que Deus diz sobre você</div><p style="font-size:14px;line-height:1.85;color:#4a3030">${devo.verdade}</p></div>`;}
  else if(p===3){b1=`<div class="card" style="border-color:rgba(74,138,90,0.25);margin-bottom:14px"><div class="lbl" style="color:#4a8a5a">🌅 A virada</div><p style="font-size:14px;line-height:1.85;color:#2a4a32;margin-bottom:12px">${devo.virada}</p><p style="font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:#4a8a5a;font-weight:600">${devo.climax}</p></div>`;const items=Array.isArray(devo.aplicacao)?devo.aplicacao:[devo.aplicacao];b2=`<div class="card"><div class="lbl" style="color:#4a8a5a">🎯 Para hoje</div>${items.map((a,i)=>`<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:13px;color:#2a4a32;line-height:1.6"><span style="background:linear-gradient(135deg,#4a8a5a,#7ab07a);color:white;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px">${i+1}</span><span>${a}</span></div>`).join('')}</div>`;}
  else if(p===4){b1=`<div style="text-align:center;margin-bottom:20px"><div style="font-size:44px;animation:pulse 2s ease-in-out infinite;margin-bottom:12px">✨</div><div style="font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.7);text-transform:uppercase;margin-bottom:12px">Declare hoje</div><p style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;line-height:1.55;color:white;text-shadow:0 2px 12px rgba(0,0,0,0.15)">${devo.climax}</p></div>`;b2=`<div style="background:rgba(255,255,255,0.15);border-radius:20px;padding:18px 20px;border:1px solid rgba(255,255,255,0.25)"><div style="font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.7);text-transform:uppercase;margin-bottom:12px">🙏 Oração</div><p style="font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:1.75;color:white;margin-bottom:16px">${devo.oracao}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn-ghost" onclick="togFav()">${S.isFav?'❤️ Salvo':'🤍 Salvar'}</button><button class="btn-ghost" onclick="shareIt()">📤 Compartilhar</button></div></div>`;}
  return`<div class="screen" style="background:${bgs[p]};transition:background .5s">${petals(isDark)}<div class="band"></div><div class="devo-bar"><button class="icon-btn" onclick="go('home')" style="${isDark?'color:white':''}">←</button><div class="dots-row">${dots}</div><button class="icon-btn" onclick="togFav()" style="${isDark?'color:white':''}">${S.isFav?'❤️':'🤍'}</button></div><div class="devo-body fade-up">${b1}${b2}</div><div class="devo-nav">${p>0?`<button class="btn-back${isDark?' btn-back-w':''}" onclick="prv()">← Voltar</button>`:''}${p<4?`<button class="btn-main" onclick="nxt()" style="background:linear-gradient(135deg,#9b4d72,#c4836a);flex:1">${btnLbls[p]}</button>`:''}${p===4?`<button class="btn-main" onclick="go('home')" style="background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.5);flex:1">Voltar ao início 🌷</button>`:''}</div></div>`;
}

function renderFavs(){const favs=S.favs;return`<div class="screen list-screen" style="background:linear-gradient(160deg,#fdf6f0,#fce8d8)">${petals()}<div class="band"></div><div class="list-hdr"><button class="icon-btn" onclick="go('home')">←</button><h2 class="list-title">Favoritos</h2><div style="width:40px"></div></div><div class="list-body">${favs.length===0?`<div class="empty"><div style="font-size:48px;margin-bottom:12px">🤍</div><p>Nenhum favorito ainda.</p><p style="font-size:12px;margin-top:8px;opacity:.7">No final do devocional, toque em "Salvar".</p></div>`:favs.map(f=>`<div class="list-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div class="list-p">${f.palavra}</div><div class="list-d">${f.tema||''} · ${fmtDate(f.date)}</div></div><button class="icon-btn" style="font-size:16px;width:32px;height:32px" onclick="rmFav('${f.date}')">🗑</button></div>${f.versiculo?`<p style="font-size:12px;color:#5a3a2a;line-height:1.6;font-style:italic;margin-bottom:6px">"${f.versiculo}"</p>`:''}<div style="font-size:11px;color:#9b4d72;font-weight:600">— ${f.referencia||''}</div></div>`).join('')}</div>${bnav('favs')}</div>`;}

function renderHist(){const hist=S.hist;return`<div class="screen list-screen" style="background:linear-gradient(160deg,#f0f8f4,#e8f4ec)">${petals()}<div class="band"></div><div class="list-hdr"><button class="icon-btn" onclick="go('home')">←</button><h2 class="list-title">Histórico</h2><div style="width:40px"></div></div><div class="list-body">${hist.length===0?`<div class="empty"><div style="font-size:48px;margin-bottom:12px">📖</div><p>Nenhuma leitura ainda.</p></div>`:hist.map(h=>`<div class="list-card" style="display:flex;align-items:center;gap:14px"><div style="width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#9b4d72,#c4836a);flex-shrink:0"></div><div><div class="list-p">${h.palavra}</div><div class="list-d">${h.tema||''}</div><div style="font-size:10px;color:#9b4d72;margin-top:2px">${fmtDate(h.date)}</div></div></div>`).join('')}</div>${bnav('hist')}</div>`;}

function renderCfg(){return`<div class="screen list-screen" style="background:linear-gradient(160deg,#fdf6f0,#f5d5e8)">${petals()}<div class="band"></div><div class="list-hdr"><button class="icon-btn" onclick="go('home')">←</button><h2 class="list-title">Configurações</h2><div style="width:40px"></div></div><div class="list-body"><div class="cfg-card"><div class="cfg-title">🔔 Lembrete Diário</div><p class="cfg-desc">Receba um lembrete toda manhã para abrir seu devocional 🌸</p><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:14px;color:#5a3a2a">Horário</span><input type="time" style="border:1.5px solid rgba(155,77,114,0.3);border-radius:10px;padding:7px 12px;font-size:14px;color:#7a3f5a;background:white;outline:none" value="${S.notifTime}" onchange="updNotif(this.value)" /></div><button class="btn-main" onclick="reqNotif()" style="background:linear-gradient(135deg,#9b4d72,#c4836a);width:100%;padding:12px">${S.notifOn?'✅ Notificações ativas':'🔔 Ativar notificações'}</button></div><div class="cfg-card"><div class="cfg-title">📲 Instalar no celular</div><p class="cfg-desc">Salve na tela inicial para acessar como um app:</p><div style="font-size:13px;color:#5a3a2a;display:flex;gap:8px;margin-bottom:8px"><span style="color:#9b4d72;font-weight:600">1.</span> Toque no botão compartilhar do navegador</div><div style="font-size:13px;color:#5a3a2a;display:flex;gap:8px;margin-bottom:8px"><span style="color:#9b4d72;font-weight:600">2.</span> Selecione "Adicionar à Tela de Início"</div><div style="font-size:13px;color:#5a3a2a;display:flex;gap:8px"><span style="color:#9b4d72;font-weight:600">3.</span> Confirme e pronto! 🌸</div></div><div class="cfg-card"><div class="cfg-title">💕 Sobre</div><p class="cfg-desc">Feito com amor por <strong>@minhacasinhainterior</strong> para cada florzinha que quer florescer com fé todos os dias.</p></div></div>${bnav('cfg')}</div>`;}

function render(){const app=document.getElementById('app');let html='';if(S.screen==='home')html=renderHome();else if(S.screen==='devo')html=renderDevo();else if(S.screen==='favs')html=renderFavs();else if(S.screen==='hist')html=renderHist();else if(S.screen==='cfg')html=renderCfg();if(S.toast)html+=`<div class="toast">${S.toast}</div>`;app.innerHTML=html;}

render();
</script>
</body>
</html>
